{% assign season = include.season | default: "gen11" %}
{% assign photos = site.data.seasons[season].photos %}
{% assign file = photos[include.id] %}
{% if file %}
<img
  class="hm-photo {{ include.class }}"
  src="{{ '/assets/img/' | append: season | append: '/' | append: file | relative_url }}"
  alt="{{ include.alt | default: include.id }}"
  width="240"
  height="240"
  loading="lazy">
{% endif %}
