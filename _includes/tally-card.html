{% assign hm = site.data.housemates | where: "id", include.entry.id | first %}
<article class="tally-card tally-{{ include.entry.state }}">
  {% include housemate-photo.html id=include.entry.id alt=hm.display_name %}
  <h3>{{ hm.display_name }}</h3>
  <p class="tally-label">{{ include.entry.label }}</p>
  <span class="tally-state">{{ include.entry.state | replace: '_', ' ' }}</span>
</article>
