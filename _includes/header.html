<header class="top">
  <div class="brand-row">
    <a class="brand" href="{{ '/' | relative_url }}">PBB Updates Board</a>
    <label class="season-switch">
      <span class="sr-only">Season</span>
      <select id="season-select" aria-label="Select season">
        {% for s in site.data.seasons %}
          <option
            value="{{ s.href | relative_url }}"
            data-available="{{ s.available }}"
            {% if s.id == site.season_id %}selected{% endif %}>
            {{ s.label }}{% unless s.available %} (coming soon){% endunless %}
          </option>
        {% endfor %}
      </select>
    </label>
  </div>
  <nav>
    <a href="{{ '/' | relative_url }}">Live</a>
    <a href="{{ '/housemates.html' | relative_url }}">Housemates</a>
    <a href="{{ '/nominations.html' | relative_url }}">Nominations</a>
    <a href="{{ '/tasks.html' | relative_url }}">Weekly Tasks</a>
    <a href="{{ '/announcements' | relative_url }}">Announcements</a>
    <a href="{{ '/api/index.json' | relative_url }}">API</a>
    <button type="button" id="theme-toggle" class="theme-btn" aria-label="Switch theme">Dark</button>
  </nav>
</header>
